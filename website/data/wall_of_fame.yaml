# Wall of Fame: devices shown on the device wall at The Things Conference.
#
# Maintained by The Things Industries, not by device makers, so vendor files
# and schema.json stay untouched. Source: the per-edition Airtable bases of
# The Things Conference ("Wall Devices/Solutions" and the earlier "Devices
# Wall of Fame" tables), matched by hand to repository device IDs. Every
# device entry in those tables counts (records marked "Not participating"
# are left out); only entries that clearly correspond to a repository
# device are listed.
#
# To add an edition: add it under `events`, then append its id to each device
# under `devices.<vendorID>.<deviceID>` (oldest first).

events:
  ttc-2022:
    name: The Things Conference 2022
    short: TTC 2022
    year: 2022
  ttc-us-2023:
    name: The Things Conference US 2023
    short: TTC US 2023
    year: 2023
  ttc-2023:
