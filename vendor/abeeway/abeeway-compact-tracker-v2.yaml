name: Compact Tracker V2
description: The Abeeway Compact Tracker V2 is a multi-mode tracker in a rugged waterproof casing, running the Abeeway Asset Tracker 3 (AT3) firmware, combining GPS, Low-power GPS, Wi-Fi Sniffer, BLE, and LoRaWAN for outdoor and indoor geolocation, powered by three replaceable AA-format batteries.
