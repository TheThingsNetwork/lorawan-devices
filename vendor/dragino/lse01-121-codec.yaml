uplinkDecoder:
  fileName: lse01-121.js
  examples:
    - description: Soil measurements (Mod 1, raw values)
      input:
        fPort: 2
        bytes: [0xCB, 0xF6, 0x0B, 0x0D, 0x03, 0x76, 0x01, 0x0A, 0xDD, 0x7F, 0xFF]
      output:
        data:
          BatV: 3.062
          Mod: 1
          Node_type: 'LSE01'
          Raw_conduct_SOIL: 56703
          Raw_water_SOIL: 266
          Soil_dielectric_constant: '88.6'
          i_flag: 15
          s_flag: 1
          temp_DS18B20: '282.90'

    - description: Soil measurements (Mod 0, calibrated values)
      input:
        fPort: 2
        bytes: [0xCB, 0xF6, 0x0B, 0x0D, 0x03, 0x76, 0x01, 0x0A, 0xDD, 0x7F, 0x0F]
      output:
        data:
          BatV: 3.062
          Mod: 0
          Node_type: 'LSE01'
          conduct_SOIL: 56703
          i_flag: 15
          s_flag: 0
          temp_DS18B20: '282.90'
          temp_SOIL: '2.66'
          water_SOIL: '8.86'

    - description: Unknown FPort
      input:
        fPort: 42
        bytes: [0xCB, 0xF6, 0x0B, 0x0D, 0x03, 0x76, 0x01, 0x0A, 0xDD, 0x7F, 0xFF]
      output:
        errors:
          - unknown FPort
