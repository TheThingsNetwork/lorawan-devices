uplinkDecoder:
  fileName: wsc1-l-131.js
  examples:
    - description: Wind speed with max and average (firmware >= 1.3.1)
      input:
        fPort: 2
        bytes: [0x01, 0x08, 0x00, 0x64, 0x00, 0xC8, 0x00, 0xBE, 0x03]
      output:
        data:
          wind_speed: 10
          wind_speed_max: 20
          wind_speed_average: 19
          wind_speed_level: 3

    - description: Unsupported frame type
      input:
        fPort: 2
        bytes: [0xE0, 0x00]
      output:
        errors:
          - 'unsupported frame type: 0xe0'

    - description: Unknown FPort
      input:
        fPort: 42
        bytes: [0x01, 0x08, 0x00, 0x64, 0x00, 0xC8, 0x00, 0xBE, 0x03]
      output:
        errors:
          - unknown FPort
