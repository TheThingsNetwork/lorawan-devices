uplinkDecoder:
  fileName: ldds20-114.js
  examples:
    - description: Liquid height
      input:
        fPort: 2
        bytes: [0x0D, 0x3B, 0x0A, 0xEF, 0x00, 0x00, 0x00, 0x01]
      output:
        data:
          Node_type: 'LDDS20'
          Bat: 3.387
          Distance: 2799
          Interrupt_flag: 0
          TempC_DS18B20: '0.00'
          Sensor_flag: 1

    - description: Invalid reading
      input:
        fPort: 2
        bytes: [0x0D, 0x3B, 0x00, 0x0A, 0x00, 0x00, 0x00, 0x01]
      output:
        data:
          Node_type: 'LDDS20'
          Bat: 3.387
          Distance: 'Invalid Reading'
          Interrupt_flag: 0
          TempC_DS18B20: '0.00'
          Sensor_flag: 1

    - description: Negative temperature from the DS18B20 probe
      input:
        fPort: 2
        bytes: [0x0D, 0x3B, 0x0A, 0xEF, 0x00, 0xFF, 0x9C, 0x01]
      output:
        data:
          Node_type: 'LDDS20'
          Bat: 3.387
          Distance: 2799
          Interrupt_flag: 0
          TempC_DS18B20: '-10.00'
          Sensor_flag: 1

    - description: Invalid payload length
      input:
        fPort: 2
        bytes: [0x0D, 0x3B, 0x0A, 0xEF]
      output:
        errors:
          - 'Invalid Payload Length: 4'

    - description: Unsupported fPort
      input:
        fPort: 42
        bytes: [0x0D, 0x3B, 0x0A, 0xEF, 0x00, 0x00, 0x00, 0x01]
      output:
        errors:
          - 'Unsupported fPort: 42'
