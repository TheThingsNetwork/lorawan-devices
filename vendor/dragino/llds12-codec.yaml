uplinkDecoder:
  fileName: llds12.js
  examples:
    - description: LoRaWAN LiDAR ToF Distance Sensor
      input:
        fPort: 2
        bytes: [0x0D, 0x5C, 0x00, 0x00, 0x0B, 0x18, 0x01, 0xB1, 0x00, 0x1E, 0x01]
      output:
        data:
          Node_type: 'LLDS12'
          Bat: 3.42
          TempC_DS18B20: 0
          Lidar_distance: 284
          Lidar_signal: 433
          Lidar_temp: 30
          Interrupt_flag: 0
          Message_type: 1

    - description: Interrupt uplink with negative temperatures
      input:
        fPort: 2
        bytes: [0x0D, 0x5C, 0xFF, 0x3F, 0x0B, 0x18, 0x01, 0xB1, 0x01, 0xF2, 0x01]
      output:
        data:
          Node_type: 'LLDS12'
          Bat: 3.42
          TempC_DS18B20: -19.3
          Lidar_distance: 284
          Lidar_signal: 433
          Lidar_temp: -14
          Interrupt_flag: 1
          Message_type: 1

    - description: Device information
      input:
        fPort: 5
        bytes: [0x03, 0x01, 0x00, 0x01, 0x00, 0x07, 0x00, 0x00, 0x00, 0x00, 0x02]
      output:
        data:
          Node_type: 'LLDS12'
          Software_Type: 3
          FREQUENCY_BAND: 'EU868'
          SUB_BAND: 0
          FIRMWARE_VERSION: '1.0.0'
          SENSOR_TYPE: 7

    - description: Unknown data frame
      input:
        fPort: 2
        bytes: [0x03, 0x01, 0x00, 0x01, 0x00, 0x07, 0x00, 0x00, 0x00, 0x00, 0x02]
      output:
        errors:
          - 'unknown data frame'

    - description: Invalid payload length
      input:
        fPort: 2
        bytes: [0x0D, 0x5C, 0x00, 0x00, 0x0B, 0x18, 0x01, 0xB1, 0x00, 0x1E]
      output:
        errors:
          - 'Invalid Payload Length: 10'

    - description: Unsupported fPort
      input:
        fPort: 42
        bytes: [0x0D, 0x5C, 0x00, 0x00, 0x0B, 0x18, 0x01, 0xB1, 0x00, 0x1E, 0x01]
      output:
        errors:
          - 'Unsupported fPort: 42'
