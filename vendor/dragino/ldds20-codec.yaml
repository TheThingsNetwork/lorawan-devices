uplinkDecoder:
  fileName: ldds20.js
  examples:
    - description: Liquid height
      input:
        fPort: 2
        bytes: [0x0E, 0x1C, 0x0B, 0x05, 0x00]
      output:
        data:
          Node_type: 'LDDS20'
          Bat: 3.612
          Distance: 2821
          Interrupt_status: 0

    - description: No sensor connected
      input:
        fPort: 2
        bytes: [0x0E, 0x1C, 0x0B, 0x05]
      output:
        data:
          Node_type: 'LDDS20'
          Bat: 3.612
          Distance: 'No Sensor'
          Interrupt_status: 5

    - description: Invalid reading
      input:
        fPort: 2
        bytes: [0x0E, 0x1C, 0x00, 0x0A, 0x00]
      output:
        data:
          Node_type: 'LDDS20'
          Bat: 3.612
          Distance: 'Invalid Reading'
          Interrupt_status: 0

    - description: Unsupported fPort
      input:
        fPort: 42
        bytes: [0x0E, 0x1C, 0x0B, 0x05, 0x00]
      output:
        errors:
          - 'Unsupported fPort: 42'
