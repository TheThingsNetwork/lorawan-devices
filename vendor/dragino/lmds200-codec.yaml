uplinkDecoder:
  fileName: lmds200.js
  examples:
    - description: Distance
      input:
        fPort: 2
        bytes: [0x0B, 0x88, 0x01, 0x00, 0x25, 0x00, 0x01]
      output:
        data:
          Node_type: 'LMDS200'
          Bat: 2.952
          dis1: 256
          dis2: 9472
          DALARM_count: 0
          Distance_alarm: 0
          Interrupt_alarm: 1

    - description: Distance alarm
      input:
        fPort: 2
        bytes: [0x0D, 0x3B, 0x0A, 0xEF, 0x00, 0xFA, 0xFE]
      output:
        data:
          Node_type: 'LMDS200'
          Bat: 3.387
          dis1: 2799
          dis2: 250
          DALARM_count: 63
          Distance_alarm: 1
          Interrupt_alarm: 0

    - description: Alarm settings
      input:
        fPort: 4
        bytes: [0x00, 0x31, 0x61, 0x01, 0x00, 0x64, 0x01, 0x2C, 0x01]
      output:
        data:
          Node_type: 'LMDS200'
          TDC: 12641
          ATDC: 1
          Alarm_min: 100
          Alarm_max: 300
          Interrupt: 1

    - description: Device information
      input:
        fPort: 5
        bytes: [0x0C, 0x01, 0x02, 0x01, 0x00, 0x0F, 0xA2]
      output:
        data:
          SENSOR_MODEL: 'LMDS200'
          Ver: 102
          FREQUENCY_BAND: 'EU868'
          Sub_band: 0
          BAT: 4.002

    - description: Invalid payload length
      input:
        fPort: 2
        bytes: [0x0B, 0x88, 0x01, 0x00, 0x25, 0x00]
      output:
        errors:
          - 'Invalid Payload Length: 6'

    - description: Unsupported fPort
      input:
        fPort: 42
        bytes: [0x0B, 0x88, 0x01, 0x00, 0x25, 0x00, 0x01]
      output:
        errors:
          - 'Unsupported fPort: 42'
