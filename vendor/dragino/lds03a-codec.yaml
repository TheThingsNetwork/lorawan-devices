uplinkDecoder:
  fileName: lds03a.js
  examples:
    - description: LDS03A Outdoor Open/Close Door Sensor
      input:
        fPort: 4
        bytes: [0x31, 0x61, 0x8E, 0x57, 0x40, 0x61, 0x8E]
      output:
        data:
          TDC: 3236238
          DISALARM: 1
          KEEP_STATUS: 0
          KEEP_TIME: 24974

    - description: Device information
      input:
        fPort: 5
        bytes: [0x0A, 0x01, 0x10, 0x01, 0xFF, 0x0F, 0xA2]
      output:
        data:
          SENSOR_MODEL: 'LDS03A'
          SUB_BAND: 'NULL'
          FREQUENCY_BAND: 'EU868'
          FIRMWARE_VERSION: '1.1.0'
          BAT: 4.002

    - description: Invalid payload length
      input:
        fPort: 2
        bytes: [0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      output:
        errors:
          - 'Invalid Payload Length: 10'

    - description: Unsupported fPort
      input:
        fPort: 42
        bytes: [0x31, 0x61, 0x8E, 0x57, 0x40, 0x61, 0x8E, 0x81, 0x70, 0x05, 0x00]
      output:
        errors:
          - 'Unsupported fPort: 42'
