uplinkDecoder:
  fileName: metering.js
  examples:
    - description: MM8 pulse counters for D1 and D2
      input:
        fPort: 1
        bytes: [3, 136, 19, 0, 0, 232, 3, 0, 0, 250, 0, 0, 0]
      output:
        data:
          batteryMillivolts: 5000
          dcPowerFail: false
          device: mm8
          pulses:
            d1: 1000
            d2: 250
    - description: MM8 reporting a DC supply failure
      input:
        fPort: 1
        bytes: [3, 136, 147, 0, 0, 232, 3, 0, 0]
      output:
        data:
          batteryMillivolts: 5000
          dcPowerFail: true
          device: mm8
          pulses:
            d1: 1000
    - description: MM8 historical counters from 30 minutes ago
      input:
        fPort: 1
        bytes: [179, 136, 19, 30, 0, 232, 3, 0, 0]
      output:
        data:
          batteryMillivolts: 5000
          dcPowerFail: false
          device: mm8
          minutesAgo: 30
          pulses:
            d1: 1000
    - description: DMM pulse counters for D1 and D2
      input:
        fPort: 1
        bytes: [4, 16, 14, 0, 0, 10, 0, 0, 0, 20, 0, 0, 0]
      output:
        data:
          batteryMillivolts: 3600
          device: dmm
          pulses:
            d1: 10
            d2: 20
    - description: DMM historical slot from 30 minutes ago
      input:
        fPort: 1
        bytes: [180, 16, 14, 30, 0, 20, 0, 0, 0, 10, 0, 0, 0]
      output:
        data:
          batteryMillivolts: 3600
          device: dmm
          slots:
            - minutesAgo: 30
              d2: 20
              d1: 10
    - description: MM8 Modbus readings for nodes 0 and 1
      input:
        fPort: 1
        bytes: [19, 224, 46, 0, 2, 8, 63, 192, 0, 0, 64, 0, 0, 0]
      output:
        data:
          batteryMillivolts: 12000
          dcPowerFail: false
          device: modbus
          startNode: 0
          totalNodes: 8
          nodes:
            - node: 0
              reading: 1.5
            - node: 1
              reading: 2
    - description: MM8 Modbus historical reading from 30 minutes ago
      input:
        fPort: 1
        bytes: [35, 224, 46, 0, 1, 0, 30, 0, 63, 192, 0, 0]
      output:
        data:
          batteryMillivolts: 12000
          dcPowerFail: false
          device: modbus
          startNode: 0
          minutesAgo: 30
          nodes:
            - node: 0
              reading: 1.5
    - description: Unknown payload type
      input:
        fPort: 1
        bytes: [0, 0, 0]
      output:
        errors:
          - unknown payload type 0
