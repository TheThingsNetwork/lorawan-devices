name: Fence Shield
description: Solar-powered LoRaWAN sensor for monitoring electric fences. Detects voltage-related faults (cuts, drops, short circuits) within a minute, and sends device tamper/theft alerts within seconds.

# Hardware versions (optional)
hardwareVersions:
  - version: '1.3'
    numeric: 1

# Firmware versions (at least one is mandatory)
firmwareVersions:
  - # Firmware version
    version: '1.3'
    numeric: 1
    # Supported hardware versions (optional)
    hardwareVersions:
      - '1.3' # Must refer to hardwareVersions declared above
    # Firmware features (optional)
    # Valid values are: remote rejoin (trigger a join from the application layer), transmission interval (configure how
    # often he device sends a message).
    features:
      - remote rejoin
      - transmission interval
    # LoRaWAN Device Profiles per region
    # Supported regions: EU863-870, US902-928, AU915-928, AS923, CN779-787, EU433, CN470-510, KR920-923, IN865-867, RU864-870
    profiles:
      EU863-870:
        id: fence-shield-profile-eu868
        codec: fence-shield-codec
      US902-928:
        id: fence-shield-profile-us915
        codec: fence-shield-codec
      AU915-928:
        id: fence-shield-profile-au915
        codec: fence-shield-codec
      AS923:
        id: fence-shield-profile-as923
        codec: fence-shield-codec

# Type of device (optional)
# Valid values are: devkit, module, cots
deviceType: cots

# Sensors that this device features (optional)
# Valid values are:
# 4-20 ma, accelerometer, altitude, analog input, auxiliary, barometer, battery, button, bvoc, co, co2, conductivity,
# current, digital input, dissolved oxygen, distance, dust, energy, gps, gyroscope, h2s, humidity, iaq, level, light,
# lightning, link, magnetometer, moisture, motion, no, no2, o3, particulate matter, ph, pir, pm2.5, pm10, potentiometer,
# power, precipitation, pressure, proximity, pulse count, pulse frequency, radar, rainfall, rssi, smart valve, snr, so2,
# solar radiation, sound, strain, surface temperature, temperature, tilt, time, tvoc, uv, vapor pressure, velocity,
# vibration, voltage, water potential, water, weight, wifi ssid, wind direction, wind speed.
sensors:
  - voltage
  - battery
  - accelerometer
  - rssi

# Dimensions in mm (optional)
# Use width, height, length and/or diameter
dimensions:
  length: 115
  width: 65
  height: 55

# Weight in grams (optional)
weight: 320

# Battery information (optional)
battery:
  replaceable: false
  type: LiFePO4 (IFR16340)

# Operating conditions (optional)
operatingConditions:
  # Temperature (Celsius)
  temperature:
    min: 0
    max: 45

# Key provisioning (optional)
# Valid values are: custom (user can configure keys), join server and manifest.
keyProvisioning:
  - custom

# Product and data sheet URLs (optional)
productURL: https://www.safora-tech.com/safora-fence-shield
dataSheetURL: https://wiki.safora-tech.com/files/SFS-v1.3-Datasheet.pdf

# Photos (MAKE SURE THE IMAGE HAS A TRANSPARENT BACKGROUND)
photos:
  main: fence-shield-photo.png
