name: AS2-LD1 – Particulate Matter Monitoring Station
description: Autonomous station for continuous monitoring of particulate matter concentration in ambient air. A digital sensor counts particles in three size ranges (0.3–1.0 µm, 1.0–2.5 µm and 2.5–10 µm) with a counting efficiency of 50 % at 0.3 µm and 98 % at ≥0.5 µm. For PM2.5 mass concentration, the effective measuring range is 0–500 µg/m³ with a resolution of 1 µg/m³ and a maximum deviation of ±10 µg/m³ (0–100 µg/m³) or ±10 % (100–500 µg/m³), based on a standard sample air volume of 100 ml. Concentrations of 1000 µg/m³ and above can still be detected beyond the specified range. The station housing is rated IP67, while the open lower layer is rated IP42. Limits can be created in the evrlast Config Generator and sent to the station as a downlink, so that the station stores them and triggers an alarm itself when a limit is exceeded. Powered by a battery and a solar cell, the station operates maintenance-free.

# Hardware versions (optional)
hardwareVersions:
  - version: '5.0'
    numeric: 5

# Firmware versions (at least one is mandatory)
firmwareVersions:
  - # Firmware version
    version: '3.0.0'
    numeric: 3
    # Supported hardware versions (optional)
    hardwareVersions:
      - '5.0' # Must refer to hardwareVersions declared above
    # LoRaWAN Device Profiles per region
    # Supported regions: EU863-870, US902-928, AU915-928, AS923, CN779-787, EU433, CN470-510, KR920-923, IN865-867, RU864-870
    features:
      - transmission interval
    profiles:
       EU863-870:
        id: as2-ld1-profile-eu868
        lorawanCertified: false
        codec: evrlast-device-codec

# Sensors that this device features (optional)
# Valid values are:
# 4-20 ma, accelerometer, altitude, analog input, auxiliary, barometer, battery, button, bvoc, co, co2, conductivity,
# current, digital input, dissolved oxygen, distance, dust, energy, gps, gyroscope, h2s, humidity, iaq, level, light,
# lightning, link, magnetometer, moisture, motion, no, no2, o3, particulate matter, ph, pir, pm2.5, pm10, potentiometer,
# power, precipitation, pressure, proximity, pulse count, pulse frequency, radar, rainfall, rssi, smart valve, snr, so2,
# solar radiation, sound, strain, surface temperature, temperature, tilt, time, tvoc, uv, vapor pressure, velocity,
# vibration, voltage, water potential, water, weight, wifi ssid, wind direction, wind speed.
sensors:
  - particulate matter
  - pm2.5
  - pm10
  - battery

# Battery information (optional)
battery:
  replaceable: false
  type: Li-ion, solar powered

# Operating conditions (optional)
operatingConditions:
  # Temperature (Celsius)
  temperature:
    min: -10
    max: +60
  # Relative humidity (fraction of 1)
  relativeHumidity:
    min: 0
    max: 0.95

# IP rating (optional)
ipCode: IP67

# Key provisioning (optional)
# Valid values are: custom (user can configure keys), join server and manifest.
keyProvisioning:
  - manifest

# Key security (optional)
# Valid values are: none, read protected and secure element.
keySecurity: read protected

# Firmware programming (optional)
# Valid values are: serial (when the user has a serial interface to update the firmware), fuota lorawan (when the device
# supports LoRaWAN FUOTA via standard interfaces) and fuota other (other wireless update mechanism).
firmwareProgramming:
  - serial
  - fuota other

# Product and data sheet URLs (optional)
productURL: https://www.tagback.de/produkt/feinstaub-messstation/
dataSheetURL: https://docs.evrlast.com/manuals/stationen/feinstaub/

# Photos (MAKE SURE THE IMAGE HAS A TRANSPARENT BACKGROUND)
photos:
  main: as2-ld1_front_straight.png
