name: STB10 - Senzemo sensor
description: Senzemo STB10 sensor simultaneously monitors ambient and buffertemperatures (via a glass-bead filled thermal buffer) to better reflect real-world conditions, and includes onboard data logging.


hardwareVersions:
  - version: '1.0'
    numeric: 10
    partNumber: STB10

firmwareVersions:
  - version: '1.0'
    numeric: 10
    hardwareVersions:
      - '1.0'
    profiles:
      EU863-870:
        id: profile-eu868
        lorawanCertified: false
        codec: stb10-codec
      AS923:
        id: profile-as923
        lorawanCertified: false
        codec: stb10-codec
      US902-928:
        id: profile-us915
        lorawanCertified: false
        codec: stb10-codec
      AU915-928:
        id: profile-au915
        lorawanCertified: false
        codec: stb10-codec

sensors:
  - temperature
  - accelerometer
  - battery

dimensions:
  width: 90
  length: 90
  height: 22

weight: 140

battery:
  replaceable: true
  type: AA

operatingConditions:
  temperature:
    min: -40
    max: 85
  relativeHumidity:
    min: 0
    max: 1

ipCode: IP64

keyProvisioning:
  - custom
  - join server

keySecurity: none

productURL: https://senzemo.com/
dataSheetURL: https://senzemo.com/wp-content/uploads/2026/09/Senstick-STB10_Datasheet_1v2.pdf

