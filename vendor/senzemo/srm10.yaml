name: SRM10 - Senzemo sensor
description: Senzemo SRM10 sensor made to accurately measure consumption of rainfall. It is designed to operate autonomously for several years. It is suitable for wide variety of applications where accurate data readings are needed.

hardwareVersions:
  - version: '1.0'
    numeric: 10
    partNumber: SRM10

firmwareVersions:
  - version: '1.0'
    numeric: 10
    hardwareVersions:
      - '1.0'
    profiles:
      EU863-870:
        id: profile-eu868
        lorawanCertified: false
        codec: srm10-codec
      AS923:
        id: profile-as923
        lorawanCertified: false
        codec: srm10-codec
      US902-928:
        id: profile-us915
        lorawanCertified: false
        codec: srm10-codec
      AU915-928:
        id: profile-au915
        lorawanCertified: false
        codec: srm10-codec

sensors:
  - rainfall
  - battery

dimensions:
  width: 165
  height: 255

weight: 500

battery:
  replaceable: true
  type: AA

operatingConditions:
  temperature:
    min: -20
    max: 60
  relativeHumidity:
    min: 0
    max: 1

ipCode: IP64

keyProvisioning:
  - custom
  - join server

keySecurity: none

productURL: https://senzemo.com/
dataSheetURL: https://senzemo.com/

photos:
