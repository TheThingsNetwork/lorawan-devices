# ACW-GENERIC – Generic decoder for the ACW range
# Codec 1.0.0 from the ATIM codecs repository (English output).
# The same file also runs on ChirpStack v3/v4 and Node.js.

uplinkDecoder:
  fileName: acw-generic-codec.js
  examples:
    - description: Temperature and humidity
      input:
        fPort: 1
        bytes: [160, 8, 8, 133, 9, 23, 222]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
          humidity0: 61.1
        errors: []
        warnings: []
    - description: Historised temperature and humidity
      input:
        fPort: 1
        bytes: [161, 0, 60, 8, 8, 164, 8, 133, 9, 23, 162, 23, 222]
      output:
        data:
          frame_type: Measurement frame
          period: 60
          temperature0:
            - 22.12
            - 21.81
          humidity0:
            - 60.5
            - 61.1
        errors: []
        warnings: []
    - description: Two temperature and humidity channels
      input:
        fPort: 1
        bytes: [160, 8, 8, 133, 9, 23, 222, 24, 8, 112, 25, 23, 148]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
          temperature1: 21.6
          humidity0: 61.1
          humidity1: 60.36
        errors: []
        warnings: []
    - description: 'Timestamped test frame: CO2, rate, humidity and temperature'
      input:
        fPort: 1
        bytes: [197, 100, 98, 57, 220, 8, 9, 8, 9, 5, 4, 12, 1, 2, 13, 15, 8]
      output:
        data:
          frame_type: Test frame
          temperature0: 23.12
          humidity0: 12.84
          rate0: 258
          CO2: 3848
          timestamp: '2023-05-15T13:55:40.000Z'
        errors: []
        warnings: []
    - description: Two temperatures and differential pressure
      input:
        fPort: 1
        bytes: [160, 8, 8, 133, 24, 8, 80, 6, 253, 36]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
          temperature1: 21.28
          differential_pressure: -732
        errors: []
        warnings: []
    - description: Digital inputs and counter
      input:
        fPort: 1
        bytes: [160, 1, 1, 4, 0, 0, 0, 82]
      output:
        data:
          frame_type: Measurement frame
          counter0: 82
          input_state0: 1
          input_state1: 0
          input_state2: 0
          input_state3: 0
        errors: []
        warnings: []
    - description: Digital input change of state
      input:
        fPort: 1
        bytes: [160, 1, 17]
      output:
        data:
          frame_type: Measurement frame
          input_state0: switched high
          input_state1: low
          input_state2: low
          input_state3: low
        errors: []
        warnings: []
    - description: Historised current and voltage, 2 samples
      input:
        fPort: 1
        bytes: [161, 0, 60, 11, 3, 232, 4, 176, 26, 9, 96, 9, 116]
      output:
        data:
          frame_type: Measurement frame
          period: 60
          voltage1:
            - 2.4
            - 2.42
          current0:
            - 10
            - 12
        errors: []
        warnings: []
    - description: Rate (tank level) and temperature
      input:
        fPort: 1
        bytes: [160, 12, 0, 86, 8, 9, 52]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 23.56
          rate0: 86
        errors: []
        warnings: []
    - description: Temperature, humidity and PIR detection counter
      input:
        fPort: 1
        bytes: [160, 8, 8, 133, 9, 23, 222, 3, 0, 5]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
          humidity0: 61.1
          counter0: 5
        errors: []
        warnings: []
    - description: Distance
      input:
        fPort: 1
        bytes: [160, 7, 4, 210]
      output:
        data:
          frame_type: Measurement frame
          distance: 1234
        errors: []
        warnings: []
    - description: Illuminance
      input:
        fPort: 1
        bytes: [160, 5, 33, 35]
      output:
        data:
          frame_type: Measurement frame
          lux: 11.64
        errors: []
        warnings: []
    - description: 'Alert: high threshold exceeded, current of channel 0'
      input:
        fPort: 1
        bytes: [141, 75, 3, 232]
      output:
        data:
          frame_type: Alert frame
          alert: High threshold exceeded on current channel 0
          current0: 10
        errors: []
        warnings: []
    - description: 'End of alert: voltage of channel 1 back within the thresholds'
      input:
        fPort: 1
        bytes: [141, 26, 17, 148]
      output:
        data:
          frame_type: Alert frame
          alert: Back within thresholds on voltage channel 1
          voltage1: 4.5
        errors: []
        warnings: []
    - description: Error frame
      input:
        fPort: 1
        bytes: [142, 1, 158]
      output:
        data:
          frame_type: Error frame
          error: Movement or theft detected on the product
        errors: []
        warnings: []
    - description: Keep alive frame
      input:
        fPort: 1
        bytes: [129, 14, 16, 13, 172]
      output:
        data:
          frame_type: Keep alive frame
          voltagec: 3.5
          voltagev: 3.6
        errors: []
        warnings: []
    - description: Cable cut detected
      input:
        fPort: 1
        bytes: [143, 28, 32]
      output:
        data:
          frame_type: Specific frame
          cable_cut: 1
        errors: []
        warnings: []
    - description: Configuration accepted
      input:
        fPort: 1
        bytes: [134, 0]
      output:
        data:
          frame_type: Response to a configuration frame
          configuration_accepted: 1
          rejected_parameters: []
        errors: []
        warnings: []
    - description: Configuration rejected for parameters 1 and 3
      input:
        fPort: 1
        bytes: [134, 5]
      output:
        data:
          frame_type: Response to a configuration frame
          configuration_accepted: 0
          rejected_parameters:
            - 1
            - 3
        errors: []
        warnings: []
    - description: Common parameters read-back, and a product parameter in hex
      input:
        fPort: 1
        bytes: [135, 4, 3, 6, 11, 1, 148, 0, 17, 60, 0, 26, 22]
      output:
        data:
          frame_type: Response to a command frame
          command: 4
          keep_alive_period: Once every day
          timestamp_enabled: 1
          history_depth: 1
          samples_per_frame: 2
          transmission_period: 60
          parameter26: '16'
        errors: []
        warnings: []
    - description: 'Downlink error: unknown parameter'
      input:
        fPort: 1
        bytes: [136, 3]
      output:
        data:
          frame_type: Response to an invalid frame
          downlink_error: Unknown parameter
        errors: []
        warnings: []
    - description: 'Legacy product: digital inputs/outputs, temperature and counter'
      input:
        fPort: 1
        bytes: [110, 253, 1, 0, 250, 0, 1, 124, 230]
      output:
        data:
          frame_type: Digital inputs/outputs, temperature and counter 1 frame
          temperature0: 25
          counter1: 97510
          output_state0: 1
          output_state1: 0
          output_state2: 0
          output_state3: 0
          output_state4: 0
          output_state5: 0
          output_state6: 0
          output_state7: 0
          input_state0: 1
          input_state1: 0
          input_state2: 1
          input_state3: 1
          input_state4: 1
          input_state5: 1
          input_state6: 1
          input_state7: 1
        errors: []
        warnings: []
    - description: 'Legacy product: digital inputs, temperature and counter'
      input:
        fPort: 1
        bytes: [78, 245, 255, 0, 250, 0, 1, 124, 230]
      output:
        data:
          frame_type: Digital inputs, temperature and counter 1 frame
          temperature0: 25
          counter1: 97510
          input_state0: 1
          input_state1: 0
          input_state2: 1
          input_state3: 0
          input_state4: 1
          input_state5: 1
          input_state6: 1
          input_state7: 1
          input_state8: 1
          input_state9: 1
          input_state10: 1
          input_state11: 1
          input_state12: 1
          input_state13: 1
          input_state14: 1
          input_state15: 1
        errors: []
        warnings: []
    - description: 'Legacy product: 0-10 V analogue input'
      input:
        fPort: 1
        bytes: [24, 0, 125, 120]
      output:
        data:
          frame_type: 0-10 V value periodic report frame
          logic_level_dinda: 0
          voltage: 5
        errors: []
        warnings: []
    - description: 'Legacy product: 4-20 mA analogue input'
      input:
        fPort: 1
        bytes: [25, 0, 111, 134]
      output:
        data:
          frame_type: 0-20 mA value periodic report frame
          logic_level_dinda: 0
          current_analog: 12
        errors: []
        warnings: []
    - description: 'Legacy product: change of state of the MR2 inputs'
      input:
        fPort: 1
        bytes: [9, 0, 3]
      output:
        data:
          frame_type: Change of state detection frame (digital)
          wirecut: 0
          logic_level1: 1
          logic_level0: 1
        errors: []
        warnings: []
    - description: 'Legacy product: ECO counter frame (LoRaWAN, six 32-bit indexes)'
      input:
        fPort: 1
        bytes: [48, 0, 0, 0, 5, 0, 0, 0, 4, 0, 0, 0, 3, 0, 0, 0, 2, 0, 0, 0, 1, 0, 0, 0, 0]
      output:
        data:
          frame_type: ECO mode counter frame (counter 1, six 32-bit indexes, LoRaWAN)
          index5: 5
          index4: 4
          index3: 3
          index2: 2
          index1: 1
          index0: 0
        errors: []
        warnings: []
    - description: 'Legacy product: ECO counter frame (Sigfox, five 12-bit deltas)'
      input:
        fPort: 1
        bytes: [59, 0, 62, 128, 5, 0, 64, 3, 0, 32, 1]
      output:
        data:
          frame_type: Frame 3B ECO mode counter (counter 1 20 bits and five concatenated 12-bit deltas, Sigfox)
          counter_init: 1000
          delta1: 5
          delta2: 4
          delta3: 3
          delta4: 2
          delta5: 1
        errors: []
        warnings: []
    - description: 'Legacy product: PIR frame'
      input:
        fPort: 1
        bytes: [50, 1, 0, 1, 35, 0, 42, 8, 133]
      output:
        data:
          frame_type: PIR product
          type_frame: Box opening frame
          sensor_dq: Not used
          counter_pir: 42
          temperature_pir: 2181
          box: box open
        errors: []
        warnings: []
    - description: 'Legacy product: TM2D periodic report of two temperatures'
      input:
        fPort: 1
        bytes: [26, 1, 144, 255, 112]
      output:
        data:
          frame_type: Two temperatures periodic report frame
          temperature0: 25
          temperature1: -9
        errors: []
        warnings: []
    - description: 'Legacy product: TM1D periodic report of the temperature'
      input:
        fPort: 1
        bytes: [27, 1, 144]
      output:
        data:
          frame_type: Temperature periodic report frame
          temperature0: 25
        errors: []
        warnings: []
    - description: Unknown frame type
      input:
        fPort: 1
        bytes: [138, 0]
      output:
        data:
          frame_type: Unknown frame type
        errors:
          - Unknown frame type for payload 8a00
        warnings: []
downlinkEncoder:
  fileName: acw-generic-codec.js
  examples:
    - description: Set the keep alive period to once a day
      input:
        data:
          setKeepAlivePeriod: Once every day
      output:
        bytes: [3, 6]
        fPort: 1
        errors: []
        warnings: []
    - description: Set the datalogging period to 300 minutes
      input:
        data:
          setDataloggingPeriod: 300
      output:
        bytes: [212, 3, 1, 44, 1]
        fPort: 1
        errors: []
        warnings: []
    - description: Enable the timestamp in uplinks
      input:
        data:
          setTimestamp: 1
      output:
        bytes: [11, 1]
        fPort: 1
        errors: []
        warnings: []
downlinkDecoder:
  fileName: acw-generic-codec.js
