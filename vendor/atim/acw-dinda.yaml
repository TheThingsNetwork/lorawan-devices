name: ACW-DINDA - Analog Monitoring
description: The DINDA facilitates the wireless supervision of an analog signal from a 4-20 mA or 0-10V sensor.  It takes care of controlling the power supply of the sensor in order to optimize the energy consumption, it is thus particularly adapted for the isolated sites without energy.  In this case, a small solar panel or a simple battery can power the sensor and the radio transmitter.The readings are regularly transmitted on LoRaWAN networks and its configuration is configurable from the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-dinda-profile
        lorawanCertified: true
        codec: acw-generic-codec
sensors:
  - analog input
additionalRadios:
  - ble
dimensions:
  width: 17.7
  length: 95
  height: 57
operatingConditions:
  temperature:
    min: -20
    max: 55
ipCode: IP65
keySecurity: none
firmwareProgramming:
  - serial
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-DINDA/FRANCAIS/ATIM_ACW-DINDA_DS_FR.pdf
photos:
  main: acw-dinda.png
