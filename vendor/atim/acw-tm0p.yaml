name: ACW-TM0P - Temperature Probe
description: The TMxP facilitates the monitoring of up to two remote temperatures of your buildings and energy installations thanks to its two meters long -196°C | +200°C temperature probes. Measurements are regularly transmitted on** LoRaWAN** networks and its configuration is configurable from the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-tm0p-profile
        lorawanCertified: true
        codec: acw-tmxp-codec
sensors:
  - surface temperature
additionalRadios:
  - ble
dimensions:
  width: 154
  length: 54
  height: 54
weight: 305
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -25
    max: 70
ipCode: IP65
keyProvisioning:
  - custom
  - join server
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
productURL: https://www.atim.com/produits/capteur-de-temperature-1-2-sondes-pt1000/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-TMxP/ENGLISH/ATIM_ACW-TMxP_DS_EN.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/capteur-de-temperature-1-2-sondes-pt1000/
photos:
  main: acw-tm0p.png
