# ACW-MR4 – Pulse counter & dry contacts
# Codec 1.0.0 from the ATIM codecs repository (English output).
# The same file also runs on ChirpStack v3/v4 and Node.js.

uplinkDecoder:
  fileName: acw-mr4-codec.js
  examples:
    - description: Digital inputs and counter
      input:
        fPort: 1
        bytes: [160, 1, 1, 4, 0, 0, 0, 82]
      output:
        data:
          frame_type: Measurement frame
          counter0: 82
          input_state0: 1
          input_state1: 0
          input_state2: 0
          input_state3: 0
        errors: []
        warnings: []
    - description: Keep alive frame
      input:
        fPort: 1
        bytes: [129, 14, 16, 13, 172]
      output:
        data:
          frame_type: Keep alive frame
          voltagec: 3.5
          voltagev: 3.6
        errors: []
        warnings: []
    - description: Digital input change of state
      input:
        fPort: 1
        bytes: [160, 1, 16]
      output:
        data:
          frame_type: Measurement frame
          input_state0: switched low
          input_state1: low
          input_state2: low
          input_state3: low
        errors: []
        warnings: []
    - description: Historised digital inputs
      input:
        fPort: 1
        bytes: [161, 0, 60, 1, 15, 5]
      output:
        data:
          frame_type: Measurement frame
          period: 60
          input_state0:
            - 1
            - 1
          input_state1:
            - 1
            - 0
          input_state2:
            - 1
            - 1
          input_state3:
            - 1
            - 0
        errors: []
        warnings: []
downlinkEncoder:
  fileName: acw-mr4-codec.js
  examples:
    - description: Set the keep alive period to once a day
      input:
        data:
          setKeepAlivePeriod: Once every day
      output:
        bytes: [3, 6]
        fPort: 1
        errors: []
        warnings: []
    - description: Set the datalogging period to 300 minutes
      input:
        data:
          setDataloggingPeriod: 300
      output:
        bytes: [212, 3, 1, 44, 1]
        fPort: 1
        errors: []
        warnings: []
    - description: Enable the timestamp in uplinks
      input:
        data:
          setTimestamp: 1
      output:
        bytes: [11, 1]
        fPort: 1
        errors: []
        warnings: []
downlinkDecoder:
  fileName: acw-mr4-codec.js
