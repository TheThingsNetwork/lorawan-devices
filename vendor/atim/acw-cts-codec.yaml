# ACW-CTS – Self-powered current sensor
# Codec 1.0.0 from the ATIM codecs repository (English output).
# The same file also runs on ChirpStack v3/v4 and Node.js.

uplinkDecoder:
  fileName: acw-cts-codec.js
  examples:
    - description: Historised current and voltage
      input:
        fPort: 1
        bytes: [161, 0, 60, 11, 3, 232, 4, 176, 26, 0, 24, 0, 232]
      output:
        data:
          frame_type: Measurement frame
          period: 60
          voltage:
            - 0.024
            - 0.232
          current:
            - 10
            - 12
        errors: []
        warnings: []
    - description: Keep alive frame
      input:
        fPort: 1
        bytes: [129, 14, 16, 13, 172]
      output:
        data:
          frame_type: Keep alive frame
          voltagec: 3.5
          voltagev: 3.6
        errors: []
        warnings: []
    - description: Temperature and current
      input:
        fPort: 1
        bytes: [160, 8, 8, 133, 11, 3, 232]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
          current: 10
        errors: []
        warnings: []
downlinkEncoder:
  fileName: acw-cts-codec.js
  examples:
    - description: Set the keep alive period to once a day
      input:
        data:
          setKeepAlivePeriod: Once every day
      output:
        bytes: [3, 6]
        fPort: 1
        errors: []
        warnings: []
    - description: Set the datalogging period to 300 minutes
      input:
        data:
          setDataloggingPeriod: 300
      output:
        bytes: [212, 3, 1, 44, 1]
        fPort: 1
        errors: []
        warnings: []
    - description: Enable the timestamp in uplinks
      input:
        data:
          setTimestamp: 1
      output:
        bytes: [11, 1]
        fPort: 1
        errors: []
        warnings: []
downlinkDecoder:
  fileName: acw-cts-codec.js
