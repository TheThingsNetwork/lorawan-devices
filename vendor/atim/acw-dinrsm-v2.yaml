name: ACW-DINRSM-V2 - Modbus Master Gateway
description: Modbus master gateway on an RS-485 serial link. It polls Modbus slaves periodically and transmits their registers over LoRaWAN. The codec decodes heartbeat frames, periodic Modbus data (returned as raw hex) and Modbus error frames.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-dinrsm-v2-profile
        lorawanCertified: true
        codec: acw-dinrsm-v2-codec
bridgeInterfaces:
  - modbus
  - rs-485
keySecurity: none
