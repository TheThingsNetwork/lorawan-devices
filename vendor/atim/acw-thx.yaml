name: ACW-THX - Temperature & Humidity Sensor
description: The THX facilitates the monitoring of comfort and energy efficiency indicators in your rooms and buildings thanks to its temperature and humidity sensors. Measurements are regularly transmitted to a local gateway or via the LoRaWAN networks. The configuration is done from the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-thx-profile
        lorawanCertified: true
        codec: acw-thx-codec
sensors:
  - temperature
  - humidity
additionalRadios:
  - ble
dimensions:
  width: 80
  length: 80
  height: 35
weight: 100
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -40
    max: 80
  relativeHumidity:
    min: 0
    max: 1
ipCode: IP30
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
productURL: https://www.atim.com/produits/acw-thx-v2temperature-humiditeinterieurelpwan/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-THX/ENGLISH/ATIM_ACW-THX_DS_EN.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/acw-thx-v2temperature-humiditeinterieurelpwan/
photos:
  main: acw-thx.png
