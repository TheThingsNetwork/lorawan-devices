# ACW-DINDxx (DIND21) – Digital I/O module
# Codec 1.0.0 from the ATIM codecs repository (English output).
# The same file also runs on ChirpStack v3/v4 and Node.js.

uplinkDecoder:
  fileName: acw-dind21-codec.js
  examples:
    - description: Digital inputs, outputs, temperature and counter
      input:
        fPort: 1
        bytes: [110, 253, 1, 0, 250, 0, 1, 124, 230]
      output:
        data:
          frame_type: Digital inputs/outputs, temperature and counter 1 frame
          temperature0: 25
          counter1: 97510
          output_state0: 1
          output_state1: 0
          output_state2: 0
          output_state3: 0
          output_state4: 0
          output_state5: 0
          output_state6: 0
          output_state7: 0
          input_state0: 1
          input_state1: 0
          input_state2: 1
          input_state3: 1
          input_state4: 1
          input_state5: 1
          input_state6: 1
          input_state7: 1
        errors: []
        warnings: []
    - description: Keep alive frame
      input:
        fPort: 1
        bytes: [129, 14, 16, 13, 172]
      output:
        data:
          frame_type: Keep alive frame
          voltagec: 3.5
          voltagev: 3.6
        errors: []
        warnings: []
    - description: Digital inputs, negative temperature and counter
      input:
        fPort: 1
        bytes: [78, 245, 255, 255, 246, 0, 1, 124, 230]
      output:
        data:
          frame_type: Digital inputs, temperature and counter 1 frame
          temperature0: -1
          counter1: 97510
          input_state0: 1
          input_state1: 0
          input_state2: 1
          input_state3: 0
          input_state4: 1
          input_state5: 1
          input_state6: 1
          input_state7: 1
          input_state8: 1
          input_state9: 1
          input_state10: 1
          input_state11: 1
          input_state12: 1
          input_state13: 1
          input_state14: 1
          input_state15: 1
        errors: []
        warnings: []
    - description: Temperature measurement frame
      input:
        fPort: 1
        bytes: [160, 8, 8, 133]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
        errors: []
        warnings: []
downlinkEncoder:
  fileName: acw-dind21-codec.js
  examples:
    - description: Set the keep alive period to once a day
      input:
        data:
          setKeepAlivePeriod: Once every day
      output:
        bytes: [3, 6]
        fPort: 1
        errors: []
        warnings: []
    - description: Set the datalogging period to 300 minutes
      input:
        data:
          setDataloggingPeriod: 300
      output:
        bytes: [212, 3, 1, 44, 1]
        fPort: 1
        errors: []
        warnings: []
    - description: Enable the timestamp in uplinks
      input:
        data:
          setTimestamp: 1
      output:
        bytes: [11, 1]
        fPort: 1
        errors: []
        warnings: []
downlinkDecoder:
  fileName: acw-dind21-codec.js
