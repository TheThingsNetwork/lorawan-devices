name: ACW-PTM2P - Differential Pressure Sensor
description: Differential pressure transmitter (±1250 Pa) with two PT1000 temperature probes and a configurable dry contact / counting input. Measurements are transmitted regularly over LoRaWAN and the device is configured with the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-ptm2p-profile
        lorawanCertified: true
        codec: acw-ptmxp-codec
sensors:
  - pressure
  - temperature
  - digital input
  - pulse count
keySecurity: none
productURL: https://www.atim.com/produits/capteur-mesure-de-pression-differentielle-et-temperature/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-PTMxP/ANGLAIS/ATIM_ACW-PTMxP_DS_EN.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/capteur-mesure-de-pression-differentielle-et-temperature/
