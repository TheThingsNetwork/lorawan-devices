name: ACW-ILB100 - Outdoor Barrier Motion Sensor
description: ACW-ILB (Infrared Light Barrier) infrared presence detection when a person passes between the barriers. This wireless barrier has 4 active infrared beams and is intended for outdoor use over a range of 100 m. It is waterproof IP65, autonomous for several years and connected. The alerts and detections are transmitted on the networks LoRaWAN and its configuration is configurable from the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-ilb100-profile
        lorawanCertified: true
        codec: acw-generic-codec
sensors:
  - pir
battery:
  replaceable: true
  type: AA
ipCode: IP55
keySecurity: none
firmwareProgramming:
