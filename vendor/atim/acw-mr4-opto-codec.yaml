# ACW-MR4-OPTO – Optical meter reader
# Codec 1.0.0 from the ATIM codecs repository (English output).
# The same file also runs on ChirpStack v3/v4 and Node.js.

uplinkDecoder:
  fileName: acw-mr4-opto-codec.js
  examples:
    - description: Meter index
      input:
        fPort: 1
        bytes: [160, 4, 0, 0, 0, 82]
      output:
        data:
          frame_type: Measurement frame
          counter0: 82
        errors: []
        warnings: []
    - description: Keep alive frame
      input:
        fPort: 1
        bytes: [129, 14, 16, 13, 172]
      output:
        data:
          frame_type: Keep alive frame
          voltagec: 3.5
          voltagev: 3.6
        errors: []
        warnings: []
    - description: Historised meter index
      input:
        fPort: 1
        bytes: [161, 0, 60, 4, 0, 0, 0, 164, 0, 0, 0, 82]
      output:
        data:
          frame_type: Measurement frame
          period: 60
          counter0:
            - 164
            - 82
        errors: []
        warnings: []
downlinkEncoder:
  fileName: acw-mr4-opto-codec.js
  examples:
    - description: Set the keep alive period to once a day
      input:
        data:
          setKeepAlivePeriod: Once every day
      output:
        bytes: [3, 6]
        fPort: 1
        errors: []
        warnings: []
    - description: Set the datalogging period to 300 minutes
      input:
        data:
          setDataloggingPeriod: 300
      output:
        bytes: [212, 3, 1, 44, 1]
        fPort: 1
        errors: []
        warnings: []
    - description: Enable the timestamp in uplinks
      input:
        data:
          setTimestamp: 1
      output:
        bytes: [11, 1]
        fPort: 1
        errors: []
        warnings: []
downlinkDecoder:
  fileName: acw-mr4-opto-codec.js
