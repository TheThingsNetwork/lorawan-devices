name: ACW-DIND21 - Digital Monitoring
description: The DINDxx facilitates the reporting of the status of up to 8 dry contacts or up to 8 pulse counter indices. It also allows to remotely control industrial equipments and to check their proper functioning. The readings are regularly transmitted on LoRaWAN networks and its configuration is configurable from the ATIM suite tools.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-dind21-profile
        lorawanCertified: true
        codec: acw-dind21-codec
sensors:
  - digital input
  - pulse count
