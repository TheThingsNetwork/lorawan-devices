name: ACW-TCR - Temperature Probe
description: ACW-TCR is equipped with an instantaneous temperature sensor with inertia and a precise humidity sensor allowing you to ensure that the storage conditions are well respected.Measurements are regularly transmitted via LoRaWAN networks and the configuration is configurable from the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-tcr-profile
        lorawanCertified: true
        codec: acw-tcr-codec
sensors:
  - surface temperature
  - humidity
additionalRadios:
  - ble
dimensions:
  width: 100
  length: 100
  height: 35
weight: 300
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -40
    max: 100
  relativeHumidity:
    min: 0
    max: 1
ipCode: IP65
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
productURL: https://www.atim.com/produits/sonde-temperature-humidite-chambre-froide-lpwan/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-TCR/ENGLISH/ATIM_ACW-TCR_DS_EN.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/sonde-temperature-humidite-chambre-froide-lpwan/
photos:
  main: acw-tcr.png
