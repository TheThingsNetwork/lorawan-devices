name: ACW-LVL - Level Sensor
description: Sensor intended for remote monitoring of the levels of many types of containers, such as dumpsters, agricultural silos or even liquid tanks. Makes it possible to significantly reduce the costs of garbage collection, for example.The ACW-LVL facilitates the wireless reporting of a distance thanks to its powerful ultrasonic sensor. The measurements are regularly transmitted on LoRaWAN networks and its configuration is configurable from the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-lvl-profile
        lorawanCertified: true
        codec: acw-generic-codec
sensors:
  - proximity
additionalRadios:
  - ble
dimensions:
  width: 100
  length: 100
  height: 40
weight: 300
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -25
    max: 70
ipCode: IP54
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
productURL: https://www.atim.com/produits/capteur-de-mesure-niveau-par-ultrasons/
