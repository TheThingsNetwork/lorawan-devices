name: ACW-WL-I - Indoor Liquid Monitoring
description: The WL facilitates the monitoring of sites at risk of flooding thanks to its liquid presence detection options. Alerts are transmitted on LoRaWAN networks and its configuration is configurable from the ATIM suite tools.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-wl-i-profile
        lorawanCertified: true
        codec: acw-wll-codec
sensors:
  - water
  - temperature
additionalRadios:
  - ble
dimensions:
  width: 80
  length: 80
  height: 35
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -20
    max: 55
ipCode: IP30
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
productURL: https://www.atim.com/produits/capteur-de-detection-fuites-de-liquides/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-WLL/FRANCAIS/ATIM_ACW-WLL_DS_FR.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/capteur-de-detection-fuites-de-liquides/
photos:
  main: acw-wl-i.png
