name: ACW-WL-I - Indoor Liquid Monitoring (former generation)
description: Former generation of the ATIM leak detector, replaced by the ACW-WLK. Water leak detection with a cable (CAB-WL, CAB-WLL with leak location, CAB-WLL-OIL for fuel oil) or with electrodes, with two optional temperature probes. The indoor WL-I version has a 100 dB buzzer. Alerts are transmitted over LoRaWAN and the device is configured with the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-wl-i-profile
        lorawanCertified: true
        codec: acw-wll-codec
sensors:
  - water
  - temperature
additionalRadios:
  - ble
dimensions:
  width: 80
  length: 80
  height: 35
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -20
    max: 55
ipCode: IP30
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-WLL/FRANCAIS/ATIM_ACW-WLL_DS_FR.pdf
photos:
  main: acw-wl-i.png
