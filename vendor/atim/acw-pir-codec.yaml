# ACW-PIRxx – Motion detector
# Codec 1.0.0 from the ATIM codecs repository (English output).
# The same file also runs on ChirpStack v3/v4 and Node.js.

uplinkDecoder:
  fileName: acw-pir-codec.js
  examples:
    - description: Temperature, humidity and detection counter
      input:
        fPort: 1
        bytes: [160, 8, 8, 133, 9, 23, 222, 3, 0, 5]
      output:
        data:
          frame_type: Measurement frame
          temperature0: 21.81
          counter0: 5
          humidity0: 61.1
        errors: []
        warnings: []
    - description: Historised temperature, humidity and detection counter
      input:
        fPort: 1
        bytes: [161, 0, 60, 8, 8, 164, 8, 133, 9, 23, 162, 23, 222, 3, 0, 15, 0, 12]
      output:
        data:
          frame_type: Measurement frame
          period: 60
          temperature0:
            - 22.12
            - 21.81
          counter0:
            - 15
            - 12
          humidity0:
            - 60.5
            - 61.1
        errors: []
        warnings: []
    - description: Keep alive frame
      input:
        fPort: 1
        bytes: [129, 14, 16, 13, 172]
      output:
        data:
          frame_type: Keep alive frame
          voltagec: 3.5
          voltagev: 3.6
        errors: []
        warnings: []
    - description: PIR product frame (enclosure opening, detection counter)
      input:
        fPort: 1
        bytes: [50, 1, 0, 1, 35, 0, 42, 8, 133]
      output:
        data:
          frame_type: PIR product
          type_frame: Box opening frame
          sensor_dq: Not used
          counter_pir: 42
          temperature_pir: 2181
          box: box open
        errors: []
        warnings: []
downlinkEncoder:
  fileName: acw-pir-codec.js
  examples:
    - description: Set the keep alive period to once a day
      input:
        data:
          setKeepAlivePeriod: Once every day
      output:
        bytes: [3, 6]
        fPort: 1
        errors: []
        warnings: []
    - description: Set the datalogging period to 300 minutes
      input:
        data:
          setDataloggingPeriod: 300
      output:
        bytes: [212, 3, 1, 44, 1]
        fPort: 1
        errors: []
        warnings: []
    - description: Enable the timestamp in uplinks
      input:
        data:
          setTimestamp: 1
      output:
        bytes: [11, 1]
        fPort: 1
        errors: []
        warnings: []
downlinkDecoder:
  fileName: acw-pir-codec.js
