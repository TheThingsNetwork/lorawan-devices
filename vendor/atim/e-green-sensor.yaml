name: ACW-CTS (e-Green Sensor) - Self-powered Current Sensor
description: The ACW-CTS (e-Green Sensor) is a battery-free current sensor powered by energy harvesting. It measures the current flowing in an electrical cable and the temperature of the equipment. It contains no battery and can be clamped on a live cable without rewiring the installation. Measurements are transmitted regularly over LoRaWAN and the device is configured with the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
  - version: 1.0-rev-A
    numeric: 2
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: e-green-sensor-profile
        lorawanCertified: true
        codec: acw-cts-codec
sensors:
  - temperature
  - voltage
  - current
additionalRadios:
  - ble
dimensions:
  width: 51
  length: 60
  height: 62
weight: 130
operatingConditions:
  temperature:
    min: -20
    max: 55
keySecurity: none
productURL: https://www.atim.com/produits/capteur-autonome/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-CTS/ANGLAIS/ATIM_ACW-CTS_DS_EN.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/capteur-autonome/
photos:
  main: e-green-sensor.png
