name: ACW-THX-O - Outdoor Temperature & Humidity Sensor
description: Outdoor temperature and humidity sensor used to monitor comfort, energy efficiency and storage conditions. Measurements are transmitted regularly over LoRaWAN and the device is configured with the tools of the ATIM suite.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-thx-o-profile
        lorawanCertified: true
        codec: acw-thx-codec
sensors:
  - temperature
  - humidity
keySecurity: none
