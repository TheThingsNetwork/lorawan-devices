name: ACW-THAQ - CO2/VOC/Temperature/Humidity Sensor
description: The THAQ facilitates the monitoring of your rooms and buildings thanks to its CO2, VOC (volatile organic compounds), temperature and relative humidity sensors. Equipped with a LED on the front panel (Green > Orange > Red) clearly indicating the need to ventilate the room, the air quality is displayed locally or the complete measurements are sent to an operated LoRaWAN network.
hardwareVersions:
  - version: '1.0'
    numeric: 1
firmwareVersions:
  - version: '1.0'
    numeric: 1
    hardwareVersions:
      - '1.0'
    features:
      - remote rejoin
      - transmission interval
    profiles:
      EU863-870:
        id: acw-thaq-profile
        lorawanCertified: true
        codec: acw-thaq-codec
sensors:
  - temperature
  - humidity
  - co2
  - tvoc
additionalRadios:
  - ble
dimensions:
  width: 80
  length: 80
  height: 35
weight: 100
battery:
  replaceable: true
  type: AA
operatingConditions:
  temperature:
    min: -20
    max: 55
  relativeHumidity:
    min: 0
    max: 1
ipCode: IP30
keySecurity: none
firmwareProgramming:
  - serial
  - fuota other
productURL: https://www.atim.com/produits/capteur-qualite-d-air-co2-voc-temperature-humidite/
dataSheetURL: https://www.atim.com/wp-content/uploads/documentation/ACW/ACW-THAQ/ENGLISH/ATIM_ACW-THAQ_DS_EN.pdf
resellerURLs:
  - name: ATIM
    region:
      - European Union
    url: https://www.atim.com/produits/capteur-qualite-d-air-co2-voc-temperature-humidite/
